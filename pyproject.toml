[project]
name = "viol-measuring"
version = "0.1.0"
description = "Parametric build123d rebuild of the General Acoustic Measurement Setup"
requires-python = ">=3.10"
dependencies = ["build123d>=0.9", "numpy"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "cad-fingerprint"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gams"]

[tool.pytest.ini_options]
# The default run is the design suite: does every part build, do the fits work,
# does it match the reference where it must, does it stand up.
#
# tests/fingerprint/ is deliberately excluded. Those suites are generated by
# cad-fingerprint from the reference meshes and are a research record of how
# close the rebuild is, not a pass/fail gate — a handful fail by design, and
# why is written up in NOTES.md. Run them with:
#     pytest tests/fingerprint -q
addopts = "--ignore=tests/fingerprint"
testpaths = ["tests"]
