[project]
name = "viol-measuring"
version = "0.1.0"
description = "Parametric build123d rebuild of the General Acoustic Measurement Setup"
requires-python = ">=3.10"
dependencies = ["build123d>=0.9", "numpy"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "cad-fingerprint"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gams"]
